name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: installer
      - name: Build Windows installer
        run: npm run build:win
        working-directory: installer
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cottoncord-win
          path: installer/dist/*.exe
          retention-days: 7

  build-mac:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: installer
      - name: Build macOS installer
        run: npm run build:mac
        working-directory: installer
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cottoncord-mac
          path: installer/dist/*.dmg
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
        working-directory: installer
      - name: Build Linux installer
        run: npm run build:linux
        working-directory: installer
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: cottoncord-linux
          path: installer/dist/*.AppImage
          retention-days: 7

  release:
    needs: [build-windows, build-linux]
    if: always() && needs.build-windows.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/cottoncord-win/**/*.exe
            artifacts/cottoncord-mac/**/*.dmg
            artifacts/cottoncord-linux/**/*.AppImage
          generate_release_notes: true
